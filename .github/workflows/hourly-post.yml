name: Hourly Threads Autopost

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# 같은 저장소에서 예약 실행과 수동 실행이 겹쳐 동일 글이 중복 게시되는 것을 방지합니다.
concurrency:
  group: threads-autopost-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 새 글 확인 후 쓰레드에 게시
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python automation/gov-thread-autopost/autopost.py

      - name: 새 글 확인 후 benefit 카드 연동
        run: python automation/gov-thread-autopost/benefit_autolink.py

      - name: 혜택 상세페이지와 사이트맵 생성
        run: npm run build

      - name: 변경사항 커밋 (state, data.js)
        if: always()
        run: |
          git config user.name "gov-thread-autopost-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/gov-thread-autopost/state.json automation/gov-thread-autopost/benefit_state.json data.js benefits sitemap.xml
          git diff --cached --quiet || git commit -m "state/카드 업데이트: 자동 게시·연동 기록"
          git push
