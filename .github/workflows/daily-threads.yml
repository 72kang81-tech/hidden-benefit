name: Daily Threads Editorial

on:
  schedule:
    # 한국시간 08:10 / 13:00 / 19:30
    - cron: "10 23 * * *"
    - cron: "0 4 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "morning, question, evening"
        required: true
        default: "question"

concurrency:
  group: daily-threads-editorial
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 게시 시간대 결정
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            UTC_HOUR=$(date -u +%H)
            UTC_MINUTE=$(date -u +%M)
            case "${UTC_HOUR}:${UTC_MINUTE}" in
              23:10) SLOT="morning" ;;
              04:00) SLOT="question" ;;
              10:30) SLOT="evening" ;;
              *) echo "지원하지 않는 실행 시각"; exit 1 ;;
            esac
          fi
          echo "slot=${SLOT}" >> "${GITHUB_OUTPUT}"

      - name: Threads 정기 콘텐츠 게시
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_SLOT: ${{ steps.slot.outputs.slot }}
        run: python automation/gov-thread-autopost/daily_threads.py

      - name: 게시 상태 커밋
        if: success()
        run: |
          git config user.name "threads-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/gov-thread-autopost/daily_threads_state.json
          git diff --cached --quiet || git commit -m "Update Threads editorial posting state"
          git push
