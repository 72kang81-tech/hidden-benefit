name: Build benefit pages and social cards

on:
  push:
    branches: [main]
    paths:
      - "data.js"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/build-social.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-social-main
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match "Noto Sans CJK KR"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build pages, square cards and carousels
        run: npm run build

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benefits sitemap.xml social package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: refresh generated benefit and social assets"
          git push
