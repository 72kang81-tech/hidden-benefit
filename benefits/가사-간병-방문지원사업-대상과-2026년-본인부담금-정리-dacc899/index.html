<main class="detail"><p class="eyebrow">금융·생활비</p><h1>가사·간병 방문지원사업 대상과 2026년 본인부담금 정리</h1><p class="detail-summary">요양보호사가 가정을 방문해 세면·식사 보조, 청소, 외출동행 등을 지원하는 돌봄 서비스로, 소득구간에 따라 본인부담금이 달라집니다.</p>
