<main class="detail"><p class="eyebrow">의료비</p><h1>소아암 의료비 최대 3천만원, 백혈병과 그 외 암 지원금액 다르다</h1><p class="detail-summary">암환자 의료비 중 본인부담금과 비급여 비용을 지원하는 제도로, 성인은 연 최대 300만원, 소아는 암종에 따라 최대 2천만~3천만원까지 지원합니다.</p>
