<main class="detail"><p class="eyebrow">금융·생활비</p><h1>2026 상병수당 시범사업, 전국이 아니라 14개 지역입니다</h1><p class="detail-summary">업무 외 질병·부상으로 일을 하지 못하는 취업자에게 최대 150일간 수당을 지급하는 제도로, 전국이 아닌 14개 시범지역에서만 운영됩니다.</p>
<section class="detail-box"><h2>누가 확인하면 좋을까요?</h2><p>14개 시범지역 거주 또는 근무 취업자, 만 15세 이상 65세 미만으로 건강보험·고용보험·산재보험 가입자 또는 일정 요건의 자영업자</p></section>
<p class="fine">지원 대상·금액·기간은 변경될 수 있으므로 신청 전 공식 안내를 확인하세요.</p>
