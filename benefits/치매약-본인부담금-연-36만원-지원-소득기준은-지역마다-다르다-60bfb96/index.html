<main class="detail"><p class="eyebrow">의료비</p><h1>치매약 본인부담금 연 36만원 지원, 소득기준은 지역마다 다르다</h1><p class="detail-summary">치매 진단을 받고 약을 복용 중인 주민에게 진료비·약제비 본인부담금을 월 3만원, 연 36만원 한도로 지원합니다.</p>
<section class="detail-box"><h2>누가 확인하면 좋을까요?</h2><p>치매 진단을 받고 치매치료제를 복용 중이며 관할 지자체 소득기준(중위소득 120~140% 등, 지역별 상이)을 충족한 주민</p></section>
<p class="fine">지원 대상·금액·기간은 변경될 수 있으므로 신청 전 공식 안내를 확인하세요.</p>
