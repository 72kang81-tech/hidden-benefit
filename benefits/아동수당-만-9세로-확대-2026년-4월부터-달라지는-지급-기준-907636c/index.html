<main class="detail"><p class="eyebrow">의료비</p><h1>아동수당 만 9세로 확대, 2026년 4월부터 달라지는 지급 기준</h1><p class="detail-summary">2026년 아동수당은 지급 대상이 만 8세 미만에서 9세 미만으로 확대되고, 비수도권과 인구감소지역은 지급액도 늘었습니다. 시행일과 소급지급 대상, 신청방법까지 확인할 수 있습니다.</p>
<section class="detail-box"><h2>누가 확인하면 좋을까요?</h2><p>만 8세 미만 → 만 9세 미만으로 확대 (2017년 1월~2018년 3월생 약 43만 명 신규 대상)</p></section>
<p class="fine">지원 대상·금액·기간은 변경될 수 있으므로 신청 전 공식 안내를 확인하세요.</p>
