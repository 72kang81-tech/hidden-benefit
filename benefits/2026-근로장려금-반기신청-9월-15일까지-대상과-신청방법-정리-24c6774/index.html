<main class="detail"><p class="eyebrow">금융·생활비</p><h1>2026 근로장려금 반기신청, 9월 15일까지 대상과 신청방법 정리</h1><p class="detail-summary">2026년 근로장려금 반기신청은 9월 1일부터 15일까지 홈택스·손택스에서 접수합니다. 근로소득자 대상 소득·재산 기준과 12월에 35%를 먼저 받는 지급 방식, 신청 절차와 유의사항을 정리했습니다.</p>
<section class="detail-box"><h2>누가 확인하면 좋을까요?</h2><p>근로소득만 있는 근로소득자(사업소득·종교인소득자는 반기신청 대상 아님)</p></section>
<p class="fine">지원 대상·금액·기간은 변경될 수 있으므로 신청 전 공식 안내를 확인하세요.</p>
